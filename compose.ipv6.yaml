# 与 compose.local-mysql.yaml / compose.remote-mysql.yaml 一起使用。
# 宿主机必须已有可用 IPv6；配置 youtube_source_address: '::' 后才强制 IPv6。
services:
  app:
    networks:
      default: {}
      video_ipv6: {}

networks:
  default: {}
  video_ipv6:
    name: video-fixed-ipv6
    # 先运行 scripts/setup_ipv6_network.py，网络独立于 Compose 生命周期。
    external: true
