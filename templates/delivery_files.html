<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>交付文件 · 帧流</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/workspace.css"><link rel="stylesheet" href="/static/delivery.css"><script src="/static/delivery_options.js" defer></script><script src="/static/delivery_files.js" defer></script></head><body data-console-role="{{ console_user.role if console_user else 'admin' }}">{% set workspace_page='delivery' %}{% include 'workspace_nav.html' %}<div class="workspace"><header class="topbar"><div class="breadcrumb"><button type="button" class="icon-button delivery-mobile-menu" id="delivery-menu" aria-label="展开导航">☰</button><strong>交付文件</strong></div>{% include 'console_identity.html' %}</header><main class="delivery-layout"><div class="page-heading"><div><h1>交付文件</h1><p>查看已交付的字幕、无声视频、纯音频和音视频成品。</p></div><a class="button button-white" href="/#media">历史视频素材 ↗</a></div><section class="panel"><form id="delivery-filter" class="delivery-filters"><input name="q" aria-label="来源 ID 或标题" placeholder="来源 ID 或标题"><select name="kind" aria-label="文件类型"><option value="">全部类型</option><option value="subtitle">字幕</option><option value="video_only">无声视频</option><option value="audio_only">纯音频</option><option value="av">音视频成品</option></select><input name="language" aria-label="字幕语言" placeholder="字幕语言，如 en"><button type="submit" class="button button-white">查询</button></form><p id="delivery-error" role="alert"></p><div id="delivery-files"></div><div class="delivery-toolbar"><button type="button" id="delivery-prev" class="button button-white">上一页</button><button type="button" id="delivery-next" class="button button-white">下一页</button></div><p class="micro-copy">测试文件结束后删除，不出现在正式交付清单中。文件是否可读取以实际存储状态为准。</p></section></main></div><dialog id="delivery-preview" class="delivery-preview"><div class="delivery-toolbar"><strong id="delivery-preview-title"></strong><button type="button" id="delivery-preview-close" class="button button-white">关闭</button></div><div id="delivery-preview-content"></div><p role="alert" id="delivery-preview-error"></p></dialog></body></html>
