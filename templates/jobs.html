<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务中心 · 视频工作台</title>
<meta name="csrf-token" content="{{ csrf }}">
<script src="/static/jobs.js" defer></script>
<script src="/static/console-permissions.js" defer></script>
<link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/jobs.css">
</head>
<body data-console-role="{{ console_user.role if console_user else 'admin' }}">
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4M17 9h4m-4 6h4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h1m-1 6h1m-1 6h1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6m-8 4-2 2a4 4 0 0 0 6 6l3-3m-4-12 3-3a4 4 0 0 1 6 6l-2 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 6 5 5-5 5m8 1h8"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5m-5 11h5"/></symbol>
  </defs></svg>

{% set workspace_page = 'jobs' %}{% include 'workspace_nav.html' %}
<div class="workspace jobs-workspace"><header class="topbar"><div class="breadcrumb"><button id="jobs-mobile-menu" class="icon-button" aria-label="展开导航">☰</button><span>任务中心</span></div></header>
<main>
{% include 'console_identity.html' %}
<div id="system-note" class="notice" hidden></div>

<section id="center-view">
<div class="heading"><div><h1>任务中心</h1><p>建立客户任务，在任务内添加视频并查看账单；下载策略由执行实例设置。</p></div><button class="primary" id="new-task">＋ 新建任务</button></div>
<div id="center-cards" class="cards"></div>
<div class="panel"><div class="heading"><h2>客户任务</h2><div class="tools"><input class="search" id="search" placeholder="搜索客户 / 任务名称" aria-label="搜索客户或任务名称"><select id="state-filter" class="unit" aria-label="任务状态"><option value="active">未归档任务</option><option value="archived">已归档</option></select></div></div><p id="page-error" class="form-error" role="alert" hidden></p><div class="table-wrap" id="task-table"></div><div class="dialog-actions"><button id="jobs-prev">上一页</button><span id="jobs-page-label"></span><button id="jobs-next">下一页</button></div></div>
</section>
<section id="detail-view" hidden><button class="back" id="back">← 返回任务中心</button><div id="detail-heading"></div><div class="context" id="task-context"></div><div class="tabs" role="tablist"><button role="tab" data-tab="overview">任务概览</button><button role="tab" data-tab="videos">视频清单</button><button role="tab" data-tab="billing">交付与账单</button><button role="tab" data-tab="history">操作记录</button><button role="tab" data-tab="settings">任务设置</button></div><div id="detail-content"></div></section>
</main></div>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title">新建客户任务</h2><p class="muted" id="editor-caption"></p><div id="basic-fields"><div class="form-grid"><label><span>客户 *</span><input name="customer" maxlength="200" required></label><label><span>任务名称 *</span><input name="name" maxlength="200" required></label></div><div class="form-grid"><label><span>单价（元 / GB，可稍后设置）</span><input name="price" type="number" min="0" step="0.000001"></label><label><span>备注</span><input name="note" maxlength="500"></label></div></div><div id="video-fields"><label><span>视频 ID / 完整链接，每行一个</span><textarea name="ids" placeholder="npNnbj46_ik&#10;2Gu7q-KUXCk"></textarea></label><label><span>或导入 TXT / CSV 文件（UTF-8，最大 1 GB）</span><input type="file" name="file" accept=".txt,.csv"></label><p class="muted subtle">视频只添加到当前任务，同任务内自动去重。</p></div><p id="editor-error" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="clear-dialog"><form id="clear-form"><h2>清空当前任务视频清单</h2><p class="notice">本操作暂停当前任务并取消未完成导入。历史账单和磁盘文件保留。</p><label><span>清空范围</span><select name="scope"><option value="pending">仅移除未交付条目（推荐）</option><option value="all">移除全部条目，保留历史账本</option></select></label><label><span id="confirm-label"></span><input name="confirmation" autocomplete="off" required></label><p id="clear-error" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="cancel-clear">取消</button><button type="submit" class="danger">确认清空</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="log-dialog"><h2>视频执行日志</h2><pre id="log-content" tabindex="0"></pre><form method="dialog"><button>关闭</button></form></dialog>
</body>
</html>
