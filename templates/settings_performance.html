<section class="panel settings-panel concurrency-control-card">
  <div class="panel-heading concurrency-card-heading">
    <div><span class="section-kicker">CONCURRENCY CONTROL</span><h2>运行模式与并发上限</h2><p class="panel-subtitle">以下设置用于非 Cookie 池模式。启用 Cookie 池后按会话容量独立调度；渠道额度、连接预算和风控状态仍生效。</p></div>
    <span class="scope-badge">当前实例</span>
  </div>
  <div class="concurrency-mode-grid">
    <label>运行模式<select name="throughput_mode"><option value="manual">自定义</option><option value="auto">自动调节</option></select><small>自定义按固定并发执行；自动调节会在上限内根据吞吐、资源和等待情况探索。</small></label>
    <label>实例并发上限<input name="worker_count" type="number" min="1" max="64" required><small>自定义模式为下载进程数；自动模式为传输上限，并允许少量准备任务。启用 Cookie 池时不使用此值，关闭池后恢复使用。</small></label>
    <label>公网下载带宽目标（Mbps）<input name="bandwidth_mbps" type="number" min="0" max="100000" required><small>仅自动调节使用；0 表示不设目标，按资源和渠道状态运行。</small></label>
  </div>
  <p id="control-mode-note" class="settings-category-note" role="status"></p>
</section>
<section class="panel settings-panel concurrency-resource-card">
  <div class="panel-heading concurrency-card-heading"><div><span class="section-kicker">LOCAL RESOURCES</span><h2>浏览器与分片预算</h2><p class="panel-subtitle">这些是本机资源上限，实际任务数还要同时满足渠道和共享连接预算。</p></div></div>
  <div class="concurrency-resource-grid">
    <label data-provider-setting="yt5s yt1d bergung">浏览器并发数<input name="yt5s_browser_count" type="number" min="1" max="16" required><small>yt5s、yt1d、Bergung 共享。默认 2；浏览器名额不足时，增加实例并发不会加快解析。</small></label>
    <label>分片并发数<input name="fragment_concurrency" type="number" min="1" max="16" required><small>默认 4；控制分片媒体及 yt-dlp 普通 HTTP 视频的分块并行。每个任务分别计算，受连接预算限制；设为 1 时顺序下载，不支持并行的源自动回退。</small></label>
    <label>本地后处理并发<input name="postprocess_limit" type="number" min="1" max="8" required><small>默认 2，供当前实例的合并、搬移和媒体校验共用。后续任务生效；等待期间保留任务心跳和磁盘保护。</small></label>
  </div>
</section>
