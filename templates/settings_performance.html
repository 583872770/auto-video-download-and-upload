<section class="panel settings-panel control-mode-panel">
  <div class="panel-heading"><div><h2>运行模式与并发上限</h2><p class="panel-subtitle">自动调节和自定义都遵守会话、渠道及冷却限制；渠道选择策略单独设置。</p></div></div>
  <div class="scale-fields">
    <label>运行模式<select name="throughput_mode"><option value="manual">自定义</option><option value="auto">自动调节</option></select><small>自动调节在最高值内探索；自定义按固定设置执行，保护性限制始终有效。</small></label>
    <label>实例并发上限<input name="worker_count" type="number" min="1" max="64" required><small>手动模式为下载进程数；自动模式为传输上限，并增加少量准备任务。降低后让当前任务完成。</small></label>
    <label>公网下载带宽目标（Mbps）<input name="bandwidth_mbps" type="number" min="0" max="100000" required><small>仅自动调节使用；0 表示不设目标。以下载器记录的媒体接收吞吐判断，不用整机网卡流量加速。</small></label>
  </div>
  <p id="control-mode-note" class="settings-category-note" role="status"></p>
</section>
<section class="panel settings-panel scale-panel">
  <div class="panel-heading"><div><h2>浏览器与分片预算</h2></div></div>
  <div class="scale-fields">
    <label data-provider-setting="yt5s yt1d bergung">浏览器并发数（yt5s / yt1d / Bergung 共享）<input name="yt5s_browser_count" type="number" min="1" max="16" required><small>默认 2；自动模式会按资源与解析供给调整，并遵守此上限。Bergung 共享解析服务会复用空闲浏览器，解析完的地址在本机有界等待传输。</small></label>
    <label>分片并发数<input name="fragment_concurrency" type="number" min="1" max="16" required><small>默认 4；只作用于当前实例；仅影响分片视频，每个下载进程分别计算。低配置服务器可设为 1～2。</small></label>
  </div>
</section>
