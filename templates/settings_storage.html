<div class="panel settings-panel">
  <div class="panel-heading">
    <div>
      <span class="section-kicker">DOWNLOAD LOCATION</span>
      <h2>当前实例 · 素材目录</h2>
    </div>
  </div>
  <label data-local-storage>素材目录<input name="path" required placeholder="videos">
    <small>相对路径以 config.yaml 所在目录为基准</small>
  </label>
  <label data-local-storage>子目录<input name="dir" placeholder="可选，例如 minecraft">
  </label>
  <label>视频文件组织<select name="shard_downloads">
      <option value="true">按视频 ID 分目录（推荐）</option>
      <option value="false">直接保存到素材目录</option>
    </select>
    <small>仅影响新下载，已有素材保持原位置。</small>
  </label>
</div>
<div class="panel settings-panel" data-oss-storage hidden>
  <div class="panel-heading"><div><h2>当前实例 · 阿里云 OSS</h2><p class="panel-subtitle">在“下载策略”选择 OSS 后生效。视频、封面、元数据和字幕上传成功才完成交付；上传失败保留本地文件供重试。本地素材目录继续保留副本。</p></div></div>
  <label>Endpoint<input name="oss_endpoint" placeholder="https://oss-cn-hangzhou.aliyuncs.com" autocomplete="off"><small>填写 Bucket 所在地域的 OSS Endpoint，不填写 Bucket 域名。支持 -internal 内网地址。</small></label>
  <label>Bucket 名称<input name="oss_bucket" placeholder="my-video-bucket" autocomplete="off"></label>
  <label>对象前缀<input name="oss_prefix" placeholder="videos"><small>对象路径为“前缀 / 视频相对路径”。多个实例建议使用不同前缀，避免同名文件覆盖。</small></label>
  <label>AccessKey ID<input name="oss_access_key_id" autocomplete="off"><small>也可在下载实例设置 OSS_ACCESS_KEY_ID 环境变量。</small></label>
  <label>AccessKey Secret<input name="oss_access_key_secret" type="password" autocomplete="new-password"><small>留空保留已保存密钥，也可使用 OSS_ACCESS_KEY_SECRET 环境变量。</small></label>
  <label>STS Security Token（可选）<input name="oss_security_token" type="password" autocomplete="new-password"><small>仅使用临时凭据时填写，也可设置 OSS_SECURITY_TOKEN 环境变量。留空保留现有值。</small></label>
  <p class="micro-copy">请为此 Bucket 配置可上传、分片上传、列举分片和读取对象元数据的 RAM 权限。系统不修改 Bucket 访问权限，也不生成公开链接。</p>
</div>
{% include 'disk_settings.html' %}
