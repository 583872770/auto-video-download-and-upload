<div class="scale-fields" data-provider-setting="yt_dlp">
  <label>直连源地址<input name="youtube_source_address" placeholder="留空自动选择；:: 表示仅 IPv6"><small>仅直连生效，登录检测与 yt-dlp 使用相同源地址。Docker 需先具备 IPv6 网络。:: 由系统选择 IPv6，不会自动轮换 16 个地址。</small></label>
  <label>YouTube 请求节奏<select name="youtube_pacing_mode"><option value="manual">固定间隔</option><option value="adaptive">渐进调速与累计预算</option></select><small>渐进模式正常从至少 60 秒起步；近期账号限流从至少 120 秒恢复。连续稳定交付至少 6 小时且完成 100 个视频后，每两小时最多缩短 5 秒。已开始的文件传输不限制字节速度。</small></label>
<label>YouTube Cookie 使用策略<select name="youtube_cookie_usage"><option value="auto">按需使用（推荐）</option><option value="always">始终使用已选 Cookie</option><option value="never">仅匿名，不使用 Cookie</option></select><small>按需模式先用匿名请求公开内容；只有 yt-dlp 明确要求登录时才用当前 Cookie 重试一次。Cookie 池始终使用池内会话。</small></label>
  <label>YouTube 视频启动最小间隔（秒）<input name="youtube_start_interval" type="number" min="0" max="600" required><small>多个进程共享。渐进模式以此为提速下限，建议 45～60 秒；固定模式 0 表示关闭间隔。它限制解析启动，不是每个 HTTP 请求的间隔，也不是平台公布的安全额度。</small></label>
  <label>Cookie 池每会话任务上限<input name="youtube_cookie_session_limit" type="number" min="1" max="64" required><small>默认 2，预热前每会话 1 个任务，预热后按此上限执行。池模式独立调度，不使用运行模式与实例并发上限；总容量按有效会话累计，执行器最多 64 个任务。冷却、登录拦截和启动间隔仍生效。</small></label>
  <div class="youtube-pacing-runtime" data-youtube-pacing-runtime role="status" aria-live="polite">正在读取当前实例的实际启动间隔…</div>
  <label>滚动一小时启动预算<input name="youtube_hourly_start_limit" type="number" min="1" max="5000" required><small>渐进模式生效，建议先用 80。当前实例及同核心登录会话均受预算约束，视频重试与字幕补下载也计入。</small></label>
  <label>滚动二十四小时启动预算<input name="youtube_daily_start_limit" type="number" min="1" max="5000" required><small>渐进模式生效，建议先用 1200。用完后保留任务等待窗口释放；重启或切换单 Cookie / 账号池不重置记录。这是本地试运行预算，不是平台配额。</small></label>
  <label>Cookie 会话返回不可用时<select name="youtube_cookie_fallback"><option value="false">保留原始错误，不增加匿名请求（推荐）</option><option value="true">同一出口不带 Cookie 重试一次</option></select><small>匿名重试可能触发机器人验证，默认关闭。验证失败仍暂停实例，不能据此断定 Cookie 失效。</small></label>
  <label>yt-dlp 请求等待预设<select name="youtube_sleep_preset"><option value="true">启用 sleep 预设（推荐）</option><option value="false">关闭预设等待</option></select><small>采用 yt-dlp 的 sleep 预设：解析请求间隔 0.75 秒、每个媒体文件开始前等待 10～20 秒、字幕等待 5 秒。视频 / 音轨可能分别等待；不限制已开始文件的字节传输速度。它与上面的视频启动间隔共同生效，不能保证免限流。</small></label>
  <p class="micro-copy">账号被限流时，源站可能不返回 HTTP 429。Cookie 池中识别到具体限流账号时，仅该账号冷却至少一小时，其他账号继续；到期自动单任务、至少 180 秒间隔恢复。非池模式或无法确定账号时，仍停止实例并要求人工确认。登录有效、固定 IP 和更多 IPv6 都不代表账号没有配额限制。</p>
  <label>YouTube HTTP 429 最短冷却（秒）<input name="youtube_throttle_cooldown" type="number" min="30" max="3600" required><small>默认 300 秒；若源站 Retry-After 更长则按更长时间等待，之后保留现有单路恢复观察。机器人验证或登录失效仍会暂停实例，不能靠冷却保证恢复。</small></label>
</div>
