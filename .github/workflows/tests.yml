name: regression-tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      VIDEO_TEST_MYSQL_URL: mysql+pymysql://root:test-only-password@127.0.0.1:3306/mysql
      VIDEO_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      # Compose config validation needs only the CLI; it does not start containers.
      - run: docker compose version
      - run: python -m playwright install --with-deps chromium
      - run: node tests/test_polling.cjs
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify/verify_jobs.py
      - run: python scripts/verify/verify_workspace.py
      - run: python scripts/verify/verify_selected_execution.py
      - run: python scripts/verify/verify_settings_save.py
      - run: python scripts/verify/verify_settings_save.py --hybrid
      - run: python scripts/verify/verify_quality.py
      - run: python scripts/verify/verify_hot_policy.py
      - run: python scripts/verify/verify_hot_policy.py --hybrid
      - run: python scripts/verify/verify_resume.py
      - run: python scripts/verify/verify_disk_budget.py
      - run: python scripts/verify/verify_instance_management_ui.py
      - run: python scripts/verify/verify_cookie_runtime_ui.py
      - run: python scripts/verify/verify_concurrency_filters_ui.py
