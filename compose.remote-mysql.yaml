name: youtube-downloader

# 唯一的 Docker Compose 编排：连接远程 MySQL，并包含 yt5s 浏览器环境。
services:
  app:
    build:
      context: .
      args:
        MIHOMO_DOWNLOAD_BASE_URL: ${MIHOMO_DOWNLOAD_BASE_URL:-}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        WITH_YT5S_BROWSER: "1"
    init: true
    shm_size: 512m
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-5000}:5000"
      - "127.0.0.1:${YT5S_DESKTOP_PORT:-6080}:6080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VIDEO_SERVICE_ROLE: ${VIDEO_SERVICE_ROLE:-}
      VIDEO_INSTANCE_ID: ${VIDEO_INSTANCE_ID:-}
      VIDEO_INSTANCE_NAME: ${VIDEO_INSTANCE_NAME:-}
      VIDEO_INSTANCE_URL: ${VIDEO_INSTANCE_URL:-}
      VIDEO_WEB_HOSTS: ${VIDEO_WEB_HOSTS:-localhost,127.0.0.1,[::1]}
      VIDEO_WEB_HTTPS: ${VIDEO_WEB_HTTPS:-0}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_downloads}
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    volumes:
      - app_config:/data/config
      - app_state:/app/.cache/web
      - type: bind
        # Docker 引擎所在 Linux 服务器的绝对路径，避免 Windows 展开相对路径。
        source: ${VIDEO_DOWNLOAD_DIR:-/srv/youtube-videos}
        target: /data/videos
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_config:
  app_state:
