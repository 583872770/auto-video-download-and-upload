name: youtube-downloader-local

# 应用 + MySQL 一起部署；与远程数据库方案使用独立的配置和状态卷。
# 固定 IPv6 直连：先运行 scripts/setup_ipv6_network.py，再追加 -f compose.ipv6.yaml。
services:
  app:
    extends:
      file: compose.remote-mysql.yaml
      service: app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_downloads}
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # MySQL 镜像要求此变量名；配置统一读取 MYSQL_PASSWORD。
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_downloads}
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-2G}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 使用应用账号验证数据库；保留错误供 docker inspect 查看，不输出密码。
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --connect-timeout=3
          --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute='SELECT 1'
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 384m
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_config:
  app_state:
  mysql_data:
