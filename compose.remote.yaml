name: youtube-downloader

# 场景二：只部署应用，连接已有的远程 MySQL 和 Redis。
# 场景一（应用 + MySQL + Redis）见 compose.local.yaml；二选一，不叠加。
services:
  app:
    build:
      context: .
      args:
        MIHOMO_DOWNLOAD_BASE_URL: ${MIHOMO_DOWNLOAD_BASE_URL:-}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        WITH_YT5S_BROWSER: "1"
    init: true
    shm_size: 512m
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-5000}:5000"
      - "127.0.0.1:${YT5S_DESKTOP_PORT:-6080}:6080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VIDEO_INSTANCE_ID: ${VIDEO_INSTANCE_ID:-}
      VIDEO_INSTANCE_NAME: ${VIDEO_INSTANCE_NAME:-}
      VIDEO_INSTANCE_URL: ${VIDEO_INSTANCE_URL:-}
      VIDEO_WEB_HOSTS: ${VIDEO_WEB_HOSTS:-localhost,127.0.0.1,[::1]}
      VIDEO_WEB_HTTPS: ${VIDEO_WEB_HTTPS:-0}
      VIDEO_ACCOUNT_ENCRYPTION_KEY: ${VIDEO_ACCOUNT_ENCRYPTION_KEY:-}
      MYSQL_HOST: ${MYSQL_HOST:?请设置远程 MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_downloads}
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      REDIS_URL: ${REDIS_URL:?请设置远程 REDIS_URL}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_SECURITY_TOKEN: ${OSS_SECURITY_TOKEN:-}
      VIDEO_DB_POOL_SIZE: ${VIDEO_DB_POOL_SIZE:-5}
      VIDEO_DB_MAX_OVERFLOW: ${VIDEO_DB_MAX_OVERFLOW:-2}
      VIDEO_WORKER_DB_POOL_SIZE: ${VIDEO_WORKER_DB_POOL_SIZE:-2}
      VIDEO_WORKER_DB_MAX_OVERFLOW: ${VIDEO_WORKER_DB_MAX_OVERFLOW:-0}
    volumes:
      - app_config:/data/config
      - app_state:/app/.cache/web
      - type: bind
        # Docker 引擎所在 Linux 服务器的绝对路径，避免 Windows 展开相对路径。
        source: ${VIDEO_DOWNLOAD_DIR:-/srv/youtube-videos}
        target: /data/videos
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    # 更新时立即停止下载，不等待当前任务完成；MySQL 租约到期后恢复未完成任务。
    stop_grace_period: 0s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_config:
  app_state:
