# Optional second, independent executor. Add alongside local MySQL + IPv6 overrides.
# Each executor needs its own Cookie, state, selected job and fixed IPv6 egress.
services:
  account-b:
    hostname: account-b
    profiles: [account-b]
    image: ${ACCOUNT_B_IMAGE:-youtube-downloader-local-app:latest}
    build:
      context: .
      args:
        MIHOMO_DOWNLOAD_BASE_URL: ${MIHOMO_DOWNLOAD_BASE_URL:-}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        WITH_YT5S_BROWSER: "1"
    init: true
    shm_size: 512m
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VIDEO_INSTANCE_ID: ${ACCOUNT_B_INSTANCE_ID:-us-account-b}
      VIDEO_INSTANCE_NAME: ${ACCOUNT_B_INSTANCE_NAME:-YouTube Cookie B}
      VIDEO_INSTANCE_URL: http://account-b:5000
      VIDEO_WEB_HOSTS: localhost,127.0.0.1,[::1],account-b
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_downloads}
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      VIDEO_DB_POOL_SIZE: ${VIDEO_DB_POOL_SIZE:-5}
      VIDEO_DB_MAX_OVERFLOW: ${VIDEO_DB_MAX_OVERFLOW:-2}
      VIDEO_WORKER_DB_POOL_SIZE: ${VIDEO_WORKER_DB_POOL_SIZE:-2}
      VIDEO_WORKER_DB_MAX_OVERFLOW: ${VIDEO_WORKER_DB_MAX_OVERFLOW:-0}
      VIDEO_WORKER_DB_CONNECTION_BUDGET: ${VIDEO_WORKER_DB_CONNECTION_BUDGET:-48}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - account_b_config:/data/config
      - account_b_state:/app/.cache/web
      - account_b_videos:/data/videos
    networks:
      - default
      - fixed_ipv6_b
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  fixed_ipv6_b:
    external: true
    name: video-fixed-ipv6-b

volumes:
  account_b_config:
  account_b_state:
  account_b_videos:
