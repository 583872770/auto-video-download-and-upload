<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务中心 · 交互草图</title>
<style>
:root{--bg:#f5f5f0;--paper:#fff;--ink:#252c28;--muted:#667164;--line:#e1e6dc;--amber:#edc56a;--side:#202720;--green:#678568}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:var(--paper);border:1px solid var(--line);padding:9px 14px;border-radius:7px}button:disabled{opacity:.45;cursor:default}button:hover:enabled{border-color:var(--green)}button.primary{background:var(--side);color:white;border-color:var(--side)}button.danger{color:#a63c30}input,textarea,select{background:white;border:1px solid var(--line);border-radius:6px;padding:9px;width:100%}textarea{min-height:120px;resize:vertical}label{display:block;margin:12px 0}label>span{display:block;margin-bottom:5px}h1,h2,h3,p{margin:0}h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}small,.muted{color:var(--muted)}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
aside{position:fixed;inset:0 auto 0 0;width:205px;background:var(--side);color:#e4e7dd;padding:30px 20px}.brand{font-size:23px;letter-spacing:3px;margin:0 8px 38px}.brand small{display:block;font-size:11px;letter-spacing:1px;color:#abb7a5}aside button{display:block;width:100%;text-align:left;background:none;color:#b5c0ae;border:0;margin-bottom:8px;padding:12px}aside button.active{background:var(--amber);color:var(--ink)}aside .side-note{position:absolute;bottom:24px;left:28px;right:28px;color:#b5c0ae;font-size:12px}main{margin-left:205px;padding:26px 34px;max-width:1660px}.demo{padding:9px 14px;background:#f7eac8;border-radius:6px;margin-bottom:23px;color:#645020;display:flex;gap:15px;justify-content:space-between}.demo button{background:transparent;padding:0 8px;border:0;white-space:nowrap}.heading,.row,.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.heading{justify-content:space-between;margin:18px 0 22px}.heading p{margin-top:4px;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:19px}.metric>span{color:var(--muted)}.metric strong{display:block;font-size:27px;margin:7px 0 3px;font-weight:600;font-variant-numeric:tabular-nums}.metric small{display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid var(--line);padding:15px 12px}th{color:var(--muted);font-size:12px;font-weight:500}td strong{display:block}td small{display:block}tbody tr:last-child td{border-bottom:0}.open-task{padding:0;border:0;background:none;text-align:left;font-weight:600}.badge{padding:3px 9px;border-radius:5px;font-size:12px;background:#edf1e9;display:inline-block}.badge.live{background:#e4eee2;color:#38583b}.badge.pause{background:#f7ecd0;color:#705727}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:23px;overflow:auto}.tabs button{border:0;border-radius:0;background:none;padding:12px 0;white-space:nowrap;color:var(--muted)}.tabs button.active{border-bottom:3px solid var(--green);color:var(--ink);font-weight:600}.split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.track{height:11px;background:#eef0e9;border-radius:5px;overflow:hidden;margin:15px 0}.track span{display:block;height:100%;background:var(--green)}.details-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.details-line:last-child{border:0}.context{background:#eaf0e5;border-radius:7px;padding:11px 15px;margin-bottom:18px}.back{padding:0;border:0;background:none;color:var(--muted)}.search{max-width:300px}.empty{text-align:center;padding:40px;color:var(--muted)}.notice{padding:12px 15px;border-left:3px solid var(--amber);background:#faf5e8;margin:16px 0}.statelist{display:flex;gap:20px;flex-wrap:wrap}.statelist strong{margin-left:6px}.task-actions{display:flex;gap:8px;flex-wrap:wrap}.unit{width:auto;min-width:150px}dialog{border:1px solid var(--line);border-radius:13px;max-width:580px;width:calc(100% - 28px);padding:26px;color:var(--ink)}dialog::backdrop{background:#20272066}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:8px;background:var(--side);color:white;z-index:10;max-width:90%}.subtle{font-size:12px}.bill-number{font-size:36px;font-weight:600;margin:10px 0}.mobile-label{display:none}
@media(max-width:1050px){aside{width:165px;padding:25px 14px}main{margin-left:165px;padding:22px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:680px){aside{position:static;width:auto;padding:14px}.brand{font-size:18px;margin:0 0 12px}.brand small,aside .side-note{display:none}aside nav{display:flex;gap:8px}aside button{margin:0;padding:8px;text-align:center;width:auto}main{margin:0;padding:16px}.heading{align-items:flex-start}.heading h1{font-size:22px}.cards{gap:9px}.metric{padding:14px}.metric strong{font-size:23px}.panel{padding:15px}.demo{font-size:12px}.form-grid{grid-template-columns:1fr;gap:0}.tabs{gap:16px}.task-actions button{padding:8px 10px}}
</style>
</head>
<body>
<aside><div class="brand">视频工作台<small>YOUTUBE WORKSPACE</small></div><nav><button data-nav="global">全局总览</button><button data-nav="center" class="active">任务中心</button></nav><p class="side-note">任务独立管理<br>素材库 / 下载实例 / 系统设置<br>沿用现有入口</p></aside>
<main>
<div class="demo"><span>方案演示 · 所有数据和操作仅在当前页面生效，刷新后恢复。</span><button id="reset">重置演示</button></div>
<section id="global-view" hidden></section>
<section id="center-view">
<div class="heading"><div><h1>任务中心</h1><p>每一张客户清单，拥有独立进度和账单。</p></div><button class="primary" id="new-task">＋ 新建任务 / 导入清单</button></div>
<div id="center-cards" class="cards"></div>
<div class="panel"><div class="heading" style="margin-top:0"><h2>客户任务</h2><div class="tools"><input class="search" id="search" placeholder="搜索客户 / 清单名称" aria-label="搜索客户或清单名称"><select id="state-filter" class="unit" aria-label="任务状态"><option value="active">未归档任务</option><option value="running">执行中</option><option value="paused">已暂停</option><option value="archived">已归档</option></select></div></div><div class="table-wrap" id="task-table"></div></div>
</section>
<section id="detail-view" hidden><button class="back" id="back">← 返回任务中心</button><div id="detail-heading"></div><div class="context" id="task-context"></div><div class="tabs" role="tablist"><button role="tab" data-tab="overview">任务概览</button><button role="tab" data-tab="videos">视频清单</button><button role="tab" data-tab="billing">统计与计费</button><button role="tab" data-tab="history">执行记录</button><button role="tab" data-tab="settings">任务设置</button></div><div id="detail-content"></div></section>
</main>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title">新建客户任务</h2><p class="muted" id="editor-caption"></p><div id="basic-fields"><div class="form-grid"><label><span>客户 *</span><input name="customer" maxlength="200" required></label><label><span>清单名称 *</span><input name="name" maxlength="200" required></label></div><div class="form-grid"><label><span>单价（元 / GB，可稍后设置）</span><input name="price" type="number" min="0" step="0.000001"></label><label><span>备注</span><input name="note" maxlength="500"></label></div></div><label><span>视频 ID / 完整链接，每行一个</span><textarea name="ids" placeholder="npNnbj46_ik&#10;2Gu7q-KUXCk"></textarea></label><p class="muted subtle">本草图演示粘贴录入；正式版支持 TXT/CSV 文件导入与错误行导出。</p><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="clear-dialog"><form id="clear-form"><h2>清空当前任务视频清单</h2><p class="notice">本操作暂停当前任务。历史账单和磁盘文件保留。</p><label><span>清空范围</span><select name="scope"><option value="pending">仅移除未交付条目（推荐）</option><option value="all">移除全部条目，保留历史账本</option></select></label><label><span id="confirm-label"></span><input name="confirmation" autocomplete="off" required></label><div class="dialog-actions"><button type="button" id="cancel-clear">取消</button><button type="submit" class="danger">确认清空</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const metric = (label,value,note='') => `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(note)}</small></div>`;
const video = (id,status,gb=0) => ({id,status,gb,active:true});
const seed = () => [
 {id:'JOB-1026-A',customer:'星河传媒',name:'十月品牌素材 · 第一批',price:1.2,note:'720p，正式交付',state:'running',archived:false,gb:18.6,files:12,testGB:0,cleared:0,removed:[],videos:[...Array.from({length:12},(_,i)=>video('A'+String(i).padStart(10,'0'),'交付成功',1.55)),video('npNnbj46_ik','执行中'),video('2Gu7q-KUXCk','待处理'),video('WMu6ANTg8mk','待处理'),video('FAILED00001','最终失败')],history:['创建任务 · 导入 16 个有效 ID','开始下载 · 策略版本 1','已交付 12 个视频，1 个视频失败']},
 {id:'JOB-1026-B',customer:'云杉工作室',name:'产品参考视频',price:2,note:'1080p，独立客户订单',state:'paused',archived:false,gb:7.2,files:6,testGB:0,cleared:0,removed:[],videos:[...Array.from({length:6},(_,i)=>video('B'+String(i).padStart(10,'0'),'交付成功',1.2)),video('npNnbj46_ik','待处理'),video('PENDING0001','待处理')],history:['创建任务 · 导入 8 个有效 ID','已交付 6 个视频','用户暂停当前任务']},
 {id:'JOB-1026-C',customer:'星河传媒',name:'十月品牌素材 · 第二批',price:null,note:'待确认单价',state:'ready',archived:false,gb:0,files:0,testGB:0,cleared:0,removed:[],videos:[video('npNnbj46_ik','待处理'),video('N7ew0000001','待处理')],history:['创建任务 · 导入 2 个有效 ID，尚未开始']}
];
let jobs=seed(),selected=null,tab='overview',view='center',mode='new',timer;
const current=()=>jobs.find(j=>j.id===selected);
const active=j=>j.videos.filter(v=>v.active);
const count=(j,s)=>active(j).filter(v=>v.status===s).length;
const terminal=['交付成功','测试成功','跳过','最终失败'];
const progress=j=>active(j).length?Math.round(active(j).filter(v=>terminal.includes(v.status)).length/active(j).length*100):0;
const status=j=>j.archived?'已归档':!active(j).length?'空任务':j.state==='paused'?'已暂停':j.state==='running'?'执行中':active(j).every(v=>terminal.includes(v.status))?(count(j,'最终失败')?'完成但有失败':'已完成'):'待开始';
const amount=j=>j.price===null?'待设置':`¥ ${(j.gb*j.price).toFixed(2)}`;
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3500)}
function metrics(j){return metric('当前有效视频',active(j).length,`累计移除 ${j.cleared} 个条目`)+metric('处理完成率',active(j).length?progress(j)+'%':'—',`交付 ${count(j,'交付成功')} · 失败 ${count(j,'最终失败')}`)+metric('累计交付大小',j.gb.toFixed(2)+' GB',`${j.files} 个文件 · 历史累计`)+metric('本任务预计费用',amount(j),j.price===null?'单价待设置':`${j.price} 元 / GB · 未结算`)}
function renderCenter(){
 $('center-cards').innerHTML=metric('有效任务',jobs.filter(j=>!j.archived).length,'每次新建导入各自成单')+metric('执行中任务',jobs.filter(j=>!j.archived&&j.state==='running').length,'资源共享，进度独立')+metric('累计交付',jobs.reduce((s,j)=>s+j.gb,0).toFixed(2)+' GB','按任务账本累计')+metric('未结算预计费用','¥ '+jobs.reduce((s,j)=>s+j.gb*(j.price??0),0).toFixed(2),'单价未设置任务另行提示');
 const q=$('search').value.trim().toLowerCase(),f=$('state-filter').value;
 const rows=jobs.filter(j=>(j.customer+j.name).toLowerCase().includes(q)&&(f==='archived'?j.archived:!j.archived&&(f==='active'||j.state===f)));
 $('task-table').innerHTML=rows.length?`<table><thead><tr><th>任务 / 客户</th><th>状态</th><th>视频 / 交付 / 失败</th><th>处理进度</th><th>交付大小</th><th>预计费用</th><th>操作</th></tr></thead><tbody>${rows.map(j=>`<tr><td><button class="open-task" data-open="${j.id}">${esc(j.name)}</button><small>${esc(j.customer)} · ${j.id}</small></td><td><span class="badge ${j.state==='running'?'live':j.state==='paused'?'pause':''}">${status(j)}</span></td><td>${active(j).length} / ${count(j,'交付成功')} / ${count(j,'最终失败')}</td><td>${active(j).length?progress(j)+'%':'—'}</td><td>${j.gb.toFixed(2)} GB</td><td>${amount(j)}</td><td><button data-open="${j.id}">进入任务</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合条件的任务</div>';
}
function renderGlobal(){
 $('global-view').innerHTML=`<div class="heading"><div><h1>全局总览</h1><p>汇总所有任务；进入任务后查看各自的进度和账单。</p></div><button data-go-center>打开任务中心</button></div><div class="cards">${metric('业务任务',jobs.length,`已归档 ${jobs.filter(j=>j.archived).length}`)+metric('执行中任务',jobs.filter(j=>j.state==='running'&&!j.archived).length,'可同时处理多个客户任务')+metric('累计交付',jobs.reduce((s,j)=>s+j.gb,0).toFixed(2)+' GB','历史交付保留')+metric('未结算预计费用','¥ '+jobs.reduce((s,j)=>s+j.gb*(j.price??0),0).toFixed(2),`单价待设置 ${jobs.filter(j=>j.price===null).length} 单`)}</div><div class="panel"><h2>任务运行情况</h2>${jobs.filter(j=>!j.archived).map(j=>`<div class="details-line"><button class="open-task" data-open="${j.id}">${esc(j.customer)} / ${esc(j.name)}</button><span>${status(j)} · ${active(j).length?progress(j)+'%':'—'}</span></div>`).join('')}</div>`;
}
function renderDetail(){
 const j=current();if(!j)return;
 $('detail-heading').innerHTML=`<div class="heading"><div><h1>${esc(j.name)}</h1><p>${esc(j.customer)} · ${j.id} · <span class="badge">${status(j)}</span></p></div><div class="task-actions"><button class="primary" data-action="start" ${j.archived||!active(j).some(v=>v.status==='待处理')?'disabled':''}>${j.state==='paused'?'继续任务':'开始任务'}</button><button data-action="pause" ${j.state!=='running'?'disabled':''}>完成当前后暂停</button><button data-action="stop" ${j.state!=='running'?'disabled':''}>立即停止</button><button data-action="archive">${j.archived?'取消归档':'归档'}</button></div></div>`;
 $('task-context').textContent=`当前范围：${j.customer} / ${j.name}　·　概览、清单、账单和导出只属于此任务`;
 document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))});
 let html='';
 if(tab==='overview') html=`<div class="cards">${metrics(j)}</div><div class="split"><div class="panel"><div class="heading" style="margin:0"><h2>视频处理进度</h2><button data-switch="videos">管理清单 →</button></div><div class="track"><span style="width:${progress(j)}%"></span></div><div class="statelist"><span>交付<strong>${count(j,'交付成功')}</strong></span><span>失败<strong>${count(j,'最终失败')}</strong></span><span>执行中<strong>${count(j,'执行中')}</strong></span><span>待处理<strong>${count(j,'待处理')}</strong></span></div><p class="muted" style="margin-top:18px">${active(j).length?'处理完成率包含最终失败；交付成功率 '+Math.round(count(j,'交付成功')/active(j).length*100)+'%。':'当前清单为空；历史交付和费用仍保留。'}</p></div><div class="panel"><h2>交付与费用</h2><div class="details-line"><span>计费方式</span><span>成品实际字节</span></div><div class="details-line"><span>本任务单价</span><span>${j.price===null?'待设置':j.price+' 元 / GB'}</span></div><div class="details-line"><span>预计费用</span><strong>${amount(j)}</strong></div></div></div><div class="panel"><h2>当前执行</h2>${count(j,'执行中')?`<div class="details-line"><span>${esc(active(j).find(v=>v.status==='执行中').id)} · 传输中</span><span>下载实例 A · 6.8 MB/s（演示）</span></div>`:'<p class="muted" style="margin-top:12px">当前没有正在执行的视频。</p>'}</div>`;
 if(tab==='videos') html=`<div class="panel"><div class="heading" style="margin-top:0"><div><h2>视频清单 <span class="badge">${active(j).length}</span></h2><p>同任务重复 ID 自动合并；操作范围仅限当前任务。</p></div><div class="tools"><button class="primary" data-action="append" ${j.archived?'disabled':''}>＋ 追加视频</button><button data-action="retry" ${j.archived?'disabled':''}>重试失败</button><button data-action="export">导出 ID</button><button class="danger" data-action="clear" ${j.archived||!active(j).length?'disabled':''}>清空清单</button></div></div><div class="table-wrap">${active(j).length?`<table><thead><tr><th>视频 ID</th><th>状态</th><th>成品大小</th><th>操作</th></tr></thead><tbody>${active(j).map(v=>`<tr><td>${esc(v.id)}</td><td><span class="badge">${v.status}</span></td><td>${v.gb?v.gb.toFixed(2)+' GB':'—'}</td><td><button data-remove="${esc(v.id)}" ${j.archived||v.status==='执行中'?'disabled':''}>${v.status==='交付成功'?'移出清单':'移除'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">清单为空，可以追加视频。历史账本保留。</div>'}</div></div>`;
 if(tab==='billing') html=`<div class="cards">${metric('历史交付文件',j.files,'移除清单不冲减账本')+metric('计费成品',j.gb.toFixed(2)+' GB','仅合格成品')+metric('测试大小',j.testGB.toFixed(2)+' GB','不计费')+metric('账单状态','未结算','正式版支持结算快照')}</div><div class="split"><div class="panel"><h2>任务账单</h2><p class="bill-number">${amount(j)}</p><p class="muted">${j.gb.toFixed(2)} GB × ${j.price===null?'待设置单价':j.price+' 元 / GB'}</p><p class="notice">本任务跨暂停累计。视频失败重试和下载器切换不重复计费。</p><button data-action="export-bill">导出账单 CSV</button></div><div class="panel"><h2>计费说明</h2><div class="details-line">封面 / 字幕 / 失败残留<span>不计费</span></div><div class="details-line">重复完成回调<span>只登记一次</span></div><div class="details-line">清空清单 / 归档<span>历史账单保留</span></div><div class="details-line">单价未设置<span>显示待设置</span></div></div></div>`;
 if(tab==='history')html=`<div class="panel"><h2>本任务操作与执行记录</h2>${j.history.slice().reverse().map(s=>`<div class="details-line">${esc(s)}</div>`).join('')}</div>`;
 if(tab==='settings')html=`<div class="panel"><h2>任务基本信息</h2><form id="settings-form"><div class="form-grid"><label><span>客户</span><input name="customer" value="${esc(j.customer)}" required maxlength="200"></label><label><span>清单名称</span><input name="name" value="${esc(j.name)}" required maxlength="200"></label><label><span>单价（元 / GB）</span><input name="price" type="number" min="0" step="0.000001" value="${j.price??''}"></label><label><span>备注</span><input name="note" value="${esc(j.note)}"></label></div><p class="notice">未结算时修改单价会重算本任务全部交付的预计费用。</p><button type="submit" class="primary">保存任务信息</button></form></div><div class="panel"><h2>任务下载策略</h2><p style="margin-top:12px">downmp3 → yt5s · 720p · 正式模式（示意）</p><p class="muted">创建时复制系统默认值；后续系统模板调整不覆盖已有任务。代理、Cookie、浏览器和磁盘属于下载实例。</p></div>`;
 $('detail-content').innerHTML=html;
}
function render(){ $('center-view').hidden=view!=='center';$('global-view').hidden=view!=='global';$('detail-view').hidden=view!=='detail';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(view==='detail'?'center':view)));renderCenter();renderGlobal();if(view==='detail')renderDetail(); }
function openEditor(kind){mode=kind;const append=kind==='append';$('editor-form').reset();$('basic-fields').hidden=append;for(const name of ['customer','name'])$('editor-form').elements[name].required=!append;$('editor-title').textContent=append?'追加到当前任务':'新建客户任务';$('editor-caption').textContent=append?current().customer+' / '+current().name:'保存后进入待开始状态，不影响其他任务。';$('editor').showModal()}
function parse(raw){let invalid=0;const ids=[];for(const line of raw.split(/\r?\n/)){const v=line.trim();if(!v)continue;let id=v;if(/^https?:\/\//i.test(v)){try{const u=new URL(v),host=u.hostname.toLowerCase();id=host==='youtu.be'?u.pathname.slice(1):['youtube.com','www.youtube.com','m.youtube.com'].includes(host)?u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1]||'':''}catch{id=''}}if(/^[A-Za-z0-9_-]{11}$/.test(id))ids.push(id);else invalid++}return {ids,invalid}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){view=b.dataset.nav;render()}
 if(b.hasAttribute('data-go-center')){view='center';render()}
 if(b.dataset.open){selected=b.dataset.open;view='detail';tab='overview';render()}
 if(b.dataset.tab||b.dataset.switch){tab=b.dataset.tab||b.dataset.switch;renderDetail()}
 if(b.dataset.remove){const j=current(),v=j.videos.find(v=>v.id===b.dataset.remove);v.active=false;j.cleared++;j.history.push('移除视频 '+v.id+'；历史账本保留');renderDetail();notify('已移出本任务清单，文件和账本保留')}
 if(!b.dataset.action)return;const j=current(),a=b.dataset.action;
 if(a==='append'){openEditor('append');return}
 if(a==='clear'){$('clear-form').reset();$('confirm-label').textContent='输入任务名称确认：'+j.name;$('clear-dialog').showModal();return}
 if(a==='start'){j.state='running';j.history.push('开始 / 继续当前任务');notify('仅当前任务开始领取；草图不执行真实下载')}
 if(a==='pause'){j.state='paused';j.history.push('停止本任务新领取，当前视频继续执行');notify('已停止本任务领取，当前条目继续执行')}
 if(a==='stop'){j.state='paused';active(j).filter(v=>v.status==='执行中').forEach(v=>v.status='待处理');j.history.push('立即停止当前任务，未完成视频保留');notify('仅停止当前任务，其他任务继续')}
 if(a==='retry'){let n=0;active(j).filter(v=>v.status==='最终失败').forEach(v=>{v.status='待处理';n++});if(j.state!=='running')j.state='ready';j.history.push('重新入队失败视频 '+n+' 个');notify('失败视频已入队，不创建重复视频条目')}
 if(a==='archive'){j.archived=!j.archived;j.state='paused';active(j).filter(v=>v.status==='执行中').forEach(v=>v.status='待处理');j.history.push(j.archived?'归档任务，保留账本与素材':'恢复归档任务，保持暂停');notify(j.archived?'任务已归档，账本与素材保留':'任务已恢复，等待手动继续')}
 if(a==='export'){download(j.id+'-ids.txt',active(j).map(v=>v.id).join('\n'),'text/plain;charset=utf-8');return}
 if(a==='export-bill'){const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';download(j.id+'-bill.csv','\uFEFF'+[['任务编号','客户','清单名称','交付GB','单价','预计金额'],[j.id,j.customer,j.name,j.gb,j.price??'待设置',j.price===null?'待设置':(j.gb*j.price).toFixed(2)]].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');return}
 render();
});
$('new-task').onclick=()=>openEditor('new');$('cancel-editor').onclick=()=>$('editor').close();$('cancel-clear').onclick=()=>$('clear-dialog').close();$('back').onclick=()=>{view='center';render()};$('search').oninput=renderCenter;$('state-filter').onchange=renderCenter;
$('reset').onclick=()=>{jobs=seed();selected=null;tab='overview';view='center';$('search').value='';$('state-filter').value='active';render();notify('演示数据已恢复')};
$('editor-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),parsed=parse(f.get('ids'));let j;if(mode==='new'){if(!String(f.get('customer')).trim()||!String(f.get('name')).trim()){notify('客户和清单名称不能为空');return}j={id:'JOB-DEMO-'+(jobs.length+1),customer:String(f.get('customer')).trim(),name:String(f.get('name')).trim(),price:f.get('price')===''?null:Number(f.get('price')),note:f.get('note'),state:'ready',archived:false,gb:0,files:0,testGB:0,cleared:0,removed:[],videos:[],history:['创建客户任务']};jobs.unshift(j)}else j=current();let added=0,duplicates=0;for(const id of parsed.ids){const old=j.videos.find(v=>v.id===id);if(old){if(old.active){duplicates++;continue}old.active=true;if(old.status!=='交付成功')old.status='待处理';added++}else{j.videos.push(video(id,'待处理'));added++}}j.history.push(`追加录入：接纳 ${added}，重复 ${duplicates}，无效 ${parsed.invalid}`);selected=j.id;view='detail';tab='videos';$('editor').close();render();notify(`已保存：接纳 ${added}，重复 ${duplicates}，无效 ${parsed.invalid}`)};
$('clear-form').onsubmit=e=>{e.preventDefault();const j=current(),f=new FormData(e.target);if(f.get('confirmation')!==j.name){notify('任务名称不匹配');return}let n=0;active(j).forEach(v=>{if(f.get('scope')==='all'||v.status!=='交付成功'){if(v.status==='执行中')v.status='待处理';v.active=false;n++}});j.cleared+=n;j.state='paused';j.history.push(`清空清单：移除 ${n} 个视频，历史交付与费用保留`);$('clear-dialog').close();render();notify(`已移除 ${n} 个条目，其他任务不受影响`)};
$('detail-content').addEventListener('submit',e=>{if(e.target.id!=='settings-form')return;e.preventDefault();const f=new FormData(e.target),j=current();if(!String(f.get('customer')).trim()||!String(f.get('name')).trim()){notify('客户和清单名称不能为空');return}const previous=amount(j);j.customer=String(f.get('customer')).trim();j.name=String(f.get('name')).trim();j.price=f.get('price')===''?null:Number(f.get('price'));j.note=f.get('note');j.history.push(`修改任务信息 / 单价：预计费用 ${previous} → ${amount(j)}`);render();notify('已更新当前任务信息和预计费用')});
render();
})();
</script>
</body>
</html>
